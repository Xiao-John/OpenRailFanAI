# Alembic 配置（RailFanAI）
#
# 用法（在 backend/ 目录下执行）：
#   .venv/bin/alembic upgrade head          # 应用迁移（生产环境的标准做法）
#   .venv/bin/alembic revision -m "..."     # 新建迁移（改模型后）
#   .venv/bin/alembic current               # 查看当前版本
#
# 注意：数据库 URL **不在本文件写死**，由 migrations/env.py 从 app.config 读取
# （与运行期共用同一个 DATABASE_URL，避免两份配置漂移）。
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
