<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <!-- 移动优先：禁止用户缩放导致的布局抖动，支持刘海屏安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
    <link rel="icon" href="data:," />
  <meta name="description" content="RailFanAI —— 面向中国铁路车迷的 RAG/Agent 助手：交路担当、余票、时刻、径路里程、机位推荐" />
  <title>RailFanAI · 中国铁路车迷助手</title>
  <style>
    /* ============ 设计令牌 ============ */
    :root {
      --bg:#0f1115; --panel:#1a1d24; --panel-2:#14171f; --fg:#e6e8ee; --mut:#8b92a3;
      --accent:#3b82f6; --accent-dim:#2563eb; --danger:#ef4444; --line:#2a2e39;
      --user-bg:#2b5fd9; --radius:14px;
      --sidebar-w:272px; --header-h:52px;
      /* 四个方向的显示安全区：刘海/挖孔、横屏缺口、手势条都不占用。
         Java 侧已按 window insets 缩进根视图（见 MainActivity），Android 上这些通常是 0 ——
         保留是给 API 24–29 老机型兜底，两套机制不会叠加。 */
      --safe-t:env(safe-area-inset-top, 0px);
      --safe-r:env(safe-area-inset-right, 0px);
      --safe-b:env(safe-area-inset-bottom, 0px);
      --safe-l:env(safe-area-inset-left, 0px);
    }
    html[data-theme="light"] {
      --bg:#f6f7fb; --panel:#ffffff; --panel-2:#eef1f6; --fg:#1a1d24; --mut:#5b6478;
      --line:#dde2ea; --user-bg:#2b5fd9;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    /* 页面**不允许横向滚动**：横拖会把内容拽出安全区，竖排阅读也不需要它。
       需要横向滚动的只有表格（.table-wrap 自建滚动容器）。 */
    html, body { height:100%; overflow-x:hidden; max-width:100%; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      overflow:hidden;
    }
    button, input, textarea { font-family:inherit; }
    .hidden { display:none !important; }
    /* 启动/运行期错误横幅：模块脚本加载失败或抛错时唯一可见的线索
       （真机排障拿不到控制台，必须显示在页面上）。
       注意 1：这里**不做自动消失**的动画，显隐一律由内联脚本改 style.display ——
       Android 侧的 onPageFinished 探针就是靠 `style.display !== 'none'` 判断
       "横幅是否真的在显示"，用 class 切换会让探针永远报告"有错误"。
       注意 2（真机实测踩到）：横幅**不能贴顶**。模拟器（Pixel 6 AVD）上顶部约 103 CSS px
       的触摸根本不会送到 WebView（系统状态栏 + 手势区，adb input tap 在 y<270 物理像素
       时页面收不到任何事件），贴顶的话 ✕ 点了没反应、第一行正文还被状态栏的时钟盖住。
       所以整体下移：状态栏安全区 + 56px 余量。桌面浏览器里 env() 为 0，就是往下 56px，
       正好落在 52px 顶栏之下。 */
    #boot-error {
      display:none; position:fixed; left:0; right:0; z-index:99;
      top:calc(env(safe-area-inset-top, 0px) + 56px);
      max-height:45vh; overflow:auto; margin:0;
      padding:12px calc(46px + env(safe-area-inset-right, 0px)) 12px calc(14px + env(safe-area-inset-left, 0px));
      background:#7f1d1d; color:#fff; font-size:12px; line-height:1.6;
      white-space:pre-wrap; word-break:break-all;
    }
    /* 手动关闭：横幅会自己消失，但用户不该被迫等这几秒（尤其它盖住内容时）。
       top 必须与横幅同源（同样的安全区 + 56px + 6px 内边距），否则按钮会飘到横幅外面。 */
    #boot-error-close {
      display:none; position:fixed; z-index:100;
      top:calc(env(safe-area-inset-top, 0px) + 62px);
      right:calc(6px + env(safe-area-inset-right, 0px));
      width:32px; height:32px; border:none; border-radius:8px; cursor:pointer;
      background:rgba(255,255,255,.14); color:#fff; font-size:15px; line-height:1;
    }
    #boot-error-close:hover { background:rgba(255,255,255,.3); }
    /* 未配置模型时的引导条 */
    .notice {
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      margin:12px 12px 0; padding:12px 14px; border-radius:12px;
      background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.5);
      color:var(--fg); font-size:13px; line-height:1.6;
    }
    .notice .btn { flex:none; }
    .notice-close { flex:none; background:transparent; border:none; color:var(--mut);
                    font-size:16px; line-height:1; padding:4px 6px; cursor:pointer; border-radius:8px; }
    .notice-close:hover { color:var(--fg); background:rgba(255,255,255,.08); }
    /* 对话内的错误提示（用户关掉引导条后又没配 Key 时用） */
    .chat-error { margin:12px; padding:12px 14px; border-radius:12px;
                  background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.5);
                  color:var(--fg); font-size:13px; line-height:1.6;
                  display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    /* 回答被长度上限截断时的提示 */
    .truncate-note { margin-top:8px; padding:8px 10px; border-radius:10px;
                     background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.45);
                     color:var(--fg); font-size:12px; line-height:1.6; }

    /* ============ 布局：移动优先（≤1023px 抽屉式侧栏） ============ */
    /* 横向安全区：横屏时缺口在左右，内容不能压进去 */
    .app { display:flex; height:100dvh; height:100vh;
           padding-left:var(--safe-l); padding-right:var(--safe-r); }
    .sidebar {
      position:fixed; top:0; bottom:0; left:0; z-index:40;
      width:84%; max-width:320px; background:var(--panel-2);
      border-right:1px solid var(--line);
      display:flex; flex-direction:column;
      transform:translateX(-102%); transition:transform .22s ease;
      padding-top:var(--safe-t); padding-left:var(--safe-l);
      padding-bottom:var(--safe-b);
    }
    .sidebar.open { transform:none; box-shadow:0 12px 40px rgba(0,0,0,.45); }
    .scrim {
      position:fixed; inset:0; z-index:35; background:rgba(0,0,0,.5);
      opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .scrim.show { opacity:1; pointer-events:auto; }
    .main { flex:1; display:flex; flex-direction:column; min-width:0; height:100%; }

    /* 桌面/平板横屏：常驻侧栏 */
    @media (min-width:1024px) {
      .sidebar { position:static; transform:none; width:var(--sidebar-w); max-width:none;
                 box-shadow:none; }
      .scrim { display:none; }
      .menu-btn { display:none !important; }
    }

    /* ============ 顶栏 ============ */
    header {
      /* 高度 = 内容高 + 顶部安全区。
         不能只写 height:var(--header-h) 再加 padding-top:安全区 —— 那会把内容盒
         压成 (52-49)=3px，按钮溢出到状态栏区域；而状态栏区域**收不到触摸**。

         注意现在这条通常**不生效**（env() = 0）：Android 侧已经用 window insets 把
         整块 WebView 收进安全区了（见 MainActivity 里的 setOnApplyWindowInsetsListener），
         视口不再与状态栏/挖孔重叠，浏览器上报的 safe-area 自然为 0。
         保留它是给 API 24–29 的老机型兜底：那些系统上没有对应的 Java 处理，
         而窗口可能仍然伸进挖孔区。两套机制不会叠加 —— 只要 Java 缩进生效，这里就是 0。 */
      height:calc(var(--header-h) + env(safe-area-inset-top, 0px));
      flex-shrink:0; display:flex; align-items:center; gap:8px;
      padding:0 10px; border-bottom:1px solid var(--line); background:var(--panel-2);
      padding-top:env(safe-area-inset-top, 0px);
    }
    @media (min-width:1024px) { header { background:var(--bg); } }
    header .title { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden;
                    text-overflow:ellipsis; }
    header .conv-title { font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden;
                         text-overflow:ellipsis; flex:1; min-width:0; }
    header .spacer { flex:1; }
    .icon-btn {
      background:transparent; border:1px solid var(--line); color:var(--fg);
      width:38px; height:38px; min-width:38px; border-radius:10px; cursor:pointer;
      font-size:16px; display:flex; align-items:center; justify-content:center;
    }
    .icon-btn:hover { border-color:var(--accent); color:var(--accent); }
    .badge { font-size:11px; color:var(--accent); border:1px solid var(--accent);
             border-radius:999px; padding:2px 8px; font-weight:400; }
    @media (max-width:420px) { .badge { display:none; } }

    /* ============ 侧栏内容 ============ */
    .side-top { padding:12px 12px 6px; display:flex; gap:8px; align-items:center; }
    .btn {
      border:1px solid var(--line); background:var(--panel); color:var(--fg);
      border-radius:10px; padding:9px 12px; font-size:13px; cursor:pointer;
      min-height:38px;
    }
    .btn:hover { border-color:var(--accent); color:var(--accent); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; flex:1; }
    .btn.primary:hover { background:var(--accent-dim); color:#fff; }
    .btn.danger { color:var(--danger); border-color:var(--danger); }
    .btn.wide { width:100%; }
    .searchbox { padding:0 12px 8px; }
    .searchbox input {
      width:100%; background:var(--panel); border:1px solid var(--line); color:var(--fg);
      border-radius:10px; padding:9px 12px; font-size:13px; outline:none;
    }
    .searchbox input:focus { border-color:var(--accent); }
    .conv-list { flex:1; overflow-y:auto; padding:0 8px 8px; -webkit-overflow-scrolling:touch; }
    .conv-group { font-size:11px; color:var(--mut); padding:10px 8px 4px; }
    .conv-item {
      display:flex; align-items:center; gap:6px; padding:9px 10px; border-radius:10px;
      cursor:pointer; margin-bottom:2px;
    }
    .conv-item:hover, .conv-item.active { background:var(--panel); }
    .conv-item .cbody { flex:1; min-width:0; }
    .conv-item .ctitle { font-size:13px; white-space:nowrap; overflow:hidden;
                         text-overflow:ellipsis; }
    .conv-item .ctime { font-size:11px; color:var(--mut); margin-top:2px; }
    .conv-item .cmore {
      opacity:0; background:transparent; border:none; color:var(--mut); cursor:pointer;
      font-size:15px; padding:2px 6px; border-radius:6px;
    }
    .conv-item:hover .cmore, .conv-item.active .cmore { opacity:1; }
    @media (max-width:1023px) { .conv-item .cmore { opacity:1; } }
    .side-foot { border-top:1px solid var(--line); padding:8px; }
    .side-foot .row { display:flex; gap:6px; }
    .side-foot .row .btn { flex:1; font-size:12px; padding:8px 6px; }
    .side-empty { color:var(--mut); font-size:12px; text-align:center; padding:18px 10px; }

    /* ============ 视图容器 ============ */
    .view { flex:1; display:none; flex-direction:column; min-height:0; position:relative; }
    .view.active { display:flex; }

    /* ============ 对话区 ============ */
    #chat { flex:1; overflow-y:auto; padding:16px 12px 8px; display:flex; flex-direction:column;
            gap:16px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }
    @media (min-width:768px) { #chat { padding:22px 20px 8px; } }
    #chat .empty { margin:auto; text-align:center; color:var(--mut); font-size:14px;
                   line-height:2; padding:0 8px; }
    #chat .empty .ex { color:var(--accent); cursor:pointer; display:block; padding:4px 0; }
    #chat .empty .ex:hover { text-decoration:underline; }

    .row { display:flex; flex-direction:column; max-width:100%; }
    @media (min-width:768px) { .row { max-width:min(820px, 86%); } }
    .row.user { align-self:flex-end; align-items:flex-end; }
    .row.assistant { align-self:flex-start; align-items:flex-start; }

    /* 超长且无空格的串（URL、连写车次）必须能断开换行，否则会把整页撑出横向溢出 */

    .bubble, .md { overflow-wrap:anywhere; }

    /* min-width:0：flex 项默认 min-width:auto，会被内部不可断行的内容撑得比容器还宽

       （实测气泡比 .row 宽 7px，配合 overflow-x:hidden 就成了右侧被裁掉一截） */

    .bubble { min-width:0; max-width:100%; padding:11px 14px; border-radius:var(--radius); line-height:1.68; font-size:14px;
              word-break:break-word; }
    .row.user .bubble { background:var(--user-bg); color:#fff; white-space:pre-wrap; }
    .row.assistant .bubble { background:var(--panel); }

    .actions { display:flex; gap:6px; margin-top:6px; font-size:12px; opacity:0;
               transition:opacity .15s; flex-wrap:wrap; }
    .row:hover .actions, .row.pinned .actions { opacity:1; }
    @media (hover:none) { .actions { opacity:1; } }   /* 触屏常显 */
    .actions button { background:transparent; border:1px solid var(--line); color:var(--mut);
                      border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer;
                      min-height:30px; }
    .actions button:hover { border-color:var(--accent); color:var(--accent); }
    .actions button:disabled { opacity:.4; cursor:not-allowed; }

    .intent { font-size:12px; color:var(--accent); margin-bottom:6px; }
    .md { white-space:pre-wrap; }
    .md h3 { font-size:14px; margin:8px 0 3px; }
    .md code { background:var(--panel-2); color:#7fd0ff; padding:1px 5px; border-radius:4px;
               font-size:12px; }
    /* 代码块**不横向滚动**（规矩：只有表格可以横拖）—— 改成折行 */
    .md pre.code { background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
                   padding:8px 10px; margin:5px 0; white-space:pre-wrap;
                   overflow-wrap:anywhere; overflow-x:hidden; font-size:12px; }
    /* 表格（车次/余票这类回答基本都是表格）。
       必须能横向滚动：车次表天然六七列，窄屏铺开会把整个对话区撑到变形。
       nowrap 是刻意的 —— 宁可滚动，也不要把"06:18—12:11"折成两行。 */
    /* **唯一允许横向滚动的地方**：车次表天然六七列，窄屏铺开会把对话区撑变形 */
    .md .table-wrap { max-width:100%; overflow-x:auto; margin:8px 0; padding-bottom:2px;
                      -webkit-overflow-scrolling:touch; }
    .md table { border-collapse:collapse; font-size:12px; white-space:nowrap; }
    .md th, .md td { border:1px solid var(--line); padding:4px 9px; vertical-align:top; }
    .md th { background:var(--panel-2); font-weight:600; }
    .stats { margin-top:7px; font-size:12px; color:var(--accent); }
    .progress { font-size:12px; color:var(--mut); margin-bottom:5px; }
    .sources { margin-top:6px; font-size:12px; color:var(--mut); word-break:break-all; }
    .stopped-tag { margin-top:6px; font-size:12px; color:#f59e0b; }
    .error-box { margin-top:6px; font-size:12px; color:#ef4444; word-break:break-word; }
    .qtype { font-size:11px; border-radius:999px; padding:1px 7px; margin-left:6px;
             border:1px solid var(--line); color:var(--mut); }
    .qtype.knowledge { color:#f59e0b; border-color:#a16207; }
    .qtype.mixed { color:#a78bfa; border-color:#6d28d9; }
    .knowledge-hint { margin-top:6px; font-size:12px; color:#f59e0b; }
    /* 流程日志/思考过程现在排在正文**上方**，所以上下都要留白：
       否则折叠块会紧贴下面的正文，读起来像同一段。 */
    .fold { margin:8px 0; background:var(--panel-2); border:1px solid var(--line);
            border-radius:8px; padding:6px 10px; }
    .fold summary { cursor:pointer; color:var(--accent); font-size:12px; user-select:none; }
    .fold .fold-body { margin-top:6px; color:var(--mut); font-size:12px; }
    .fold pre { margin:4px 0 0; white-space:pre-wrap; color:var(--mut); font-size:12px;
                max-height:260px; overflow:auto; }
    .fold .log-line { margin:1px 0; }
    .caret { display:inline-block; width:7px; height:15px; background:var(--accent);
             vertical-align:-2px; animation:blink 1s steps(1) infinite; margin-left:2px; }
    @keyframes blink { 50% { opacity:0; } }

    .edit-wrap { display:flex; flex-direction:column; gap:8px; width:100%; }
    .edit-wrap textarea { width:100%; background:var(--panel); border:1px solid var(--accent);
                          color:var(--fg); border-radius:var(--radius); padding:11px 14px;
                          font-size:14px; line-height:1.6; resize:vertical; min-height:60px;
                          outline:none; }
    .edit-wrap .edit-actions { display:flex; gap:8px; justify-content:flex-end; }

    /* ============ 底栏（输入区） ============ */
    #usagebar { display:flex; justify-content:space-between; gap:10px; padding:4px 12px 0;
                font-size:12px; color:var(--mut); flex-shrink:0; }
    #usagebar b { color:var(--accent); font-weight:600; }
    footer { padding:8px 12px calc(10px + var(--safe-b)); display:flex; gap:8px;
             align-items:flex-end; flex-shrink:0; background:var(--bg); }
    @media (min-width:768px) { footer { padding:10px 20px calc(16px + var(--safe-b)); } }
    #input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--fg);
             border-radius:var(--radius); padding:12px 14px; font-size:16px;  /* ≥16px 防 iOS 缩放 */
             line-height:1.55; outline:none; resize:none; max-height:36vh; overflow-y:auto; }
    #input:focus { border-color:var(--accent); }
    #send { background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
            padding:0 18px; cursor:pointer; font-size:14px; min-width:64px; height:46px;
            flex-shrink:0; transition:background .15s; }
    #send:hover:not(:disabled) { background:var(--accent-dim); }
    #send.stop { background:var(--danger); font-size:16px; }
    #send:disabled { opacity:.45; cursor:not-allowed; }

    /* ============ 内容页（个人中心 / 协议 / 关于） ============ */
    .page { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
            padding:14px 12px calc(28px + var(--safe-b)); }
    @media (min-width:768px) { .page { padding:22px 20px 40px; max-width:860px; margin:0 auto;
                                       width:100%; } }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
            padding:14px; margin-bottom:12px; }
    .card h3 { margin:0 0 10px; font-size:14px; }
    .card .sub { color:var(--mut); font-size:12px; line-height:1.7; }
    .kv { display:flex; justify-content:space-between; gap:10px; padding:7px 0;
          border-bottom:1px dashed var(--line); font-size:13px; }
    .kv:last-child { border-bottom:none; }
    .kv .k { color:var(--mut); }
    .kv .v { text-align:right; word-break:break-all; }
    .form-row { display:flex; gap:8px; margin-bottom:8px; }
    .form-row input, .form-row select { flex:1; background:var(--panel-2); border:1px solid var(--line);
                      color:var(--fg); border-radius:10px; padding:11px 12px; font-size:15px;
                      outline:none; min-width:0; }
    .form-row input:focus, .form-row select:focus { border-color:var(--accent); }
    .form-row .btn { min-width:96px; }
    /* 输入框同一行里的紧凑按钮（如 Key 旁的「粘贴」）：96px 的最小宽度会把输入框
       挤到没法用，而这类按钮只有两个字。 */
    .form-row .btn.inline { min-width:auto; flex:none; padding:9px 14px; }
    .form-row label { color:var(--mut); font-size:12px; align-self:center; min-width:64px; }
    /* 顶栏的供应商入口：比 .btn 更紧凑，窄屏时只留图标不挤掉标题 */
    .llm-btn { background:transparent; border:1px solid var(--line); color:var(--mut);
               border-radius:999px; padding:5px 10px; font-size:12px; cursor:pointer;
               white-space:nowrap; }
    .llm-btn:hover { border-color:var(--accent); color:var(--accent); }
    .llm-btn.ready { color:var(--accent); border-color:var(--accent); }
    @media (max-width:480px) { .llm-btn .txt { display:none; } }
    .list-link { display:flex; align-items:center; justify-content:space-between;
                 padding:13px 4px; border-bottom:1px solid var(--line); cursor:pointer;
                 font-size:14px; }
    .list-link:last-child { border-bottom:none; }

    /* ============ 供应商列表（设置页）============
       一行一个供应商：名称 + 标签 + 状态点 + 操作。
       预设与自定义是**同一种行**，只是自定义多一个标签与删除按钮。 */
    .prov-row { display:flex; align-items:center; gap:10px; padding:14px 16px;
                border:1px solid var(--line); border-radius:14px; margin-bottom:10px;
                background:var(--panel-2); }
    .prov-row.active { border-color:var(--accent); }
    .prov-main { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
    .prov-name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden;
                 text-overflow:ellipsis; }
    .prov-tag { font-size:11px; color:var(--mut); border:1px solid var(--line);
                border-radius:6px; padding:1px 6px; white-space:nowrap; }
    .prov-tag.using { color:var(--accent); border-color:var(--accent); }
    .prov-dot { width:9px; height:9px; border-radius:50%; background:var(--line); flex:none; }
    .prov-dot.ok { background:#22c55e; }
    .prov-actions { display:flex; gap:6px; flex:none; }
    .prov-actions .btn { min-width:auto; padding:6px 12px; font-size:13px; }
    .prov-add-row { display:flex; gap:10px; margin-top:4px; flex-wrap:wrap; }
    .prov-add-row .btn { flex:1; min-width:150px; padding:14px; font-size:14px; }
    .btn.ghost { background:transparent; border:1px dashed var(--line); color:var(--fg); }
    .btn.ghost:hover { border-color:var(--accent); color:var(--accent); border-style:solid; }

    .preset-list { display:flex; flex-direction:column; gap:8px; margin:8px 0 14px; }
    .preset-row { display:flex; align-items:center; gap:10px; padding:12px 14px;
                  border:1px solid var(--line); border-radius:12px; }
    .preset-row .btn { min-width:auto; padding:6px 12px; font-size:13px; flex:none; }
    .preset-note { color:var(--mut); font-size:12px; flex:1; min-width:0;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .preset-row .prov-name { flex:none; }
    .form-row select { flex:1; }
    .card .sub + .prov-row { margin-top:12px; }
    .list-link .arrow { color:var(--mut); }
    /* 外链：内容页里唯一需要真正跳出去的东西（GitHub issue）。
       当普通链接样式会与正文糊在一起，这里给足点击区域与视觉提示。 */
    a.link-out {
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:13px 12px; margin-top:4px; border:1px solid var(--accent);
      border-radius:10px; color:var(--accent); text-decoration:none;
      font-size:14px; word-break:break-all;
    }
    a.link-out:hover { background:rgba(59,130,246,.12); }
    .url-plain { color:var(--mut); font-size:12px; word-break:break-all;
                 user-select:text; -webkit-user-select:text; }
    .page h1 { font-size:18px; margin:4px 0 12px; }
    .page h2 { font-size:14px; margin:18px 0 6px; }
    .page p, .page li { font-size:13.5px; line-height:1.8; color:var(--fg); }
    .page .todo { color:#f59e0b; font-size:12px; background:rgba(245,158,11,.08);
                  border:1px dashed #a16207; border-radius:8px; padding:8px 10px; margin:8px 0; }
    .page .meta { color:var(--mut); font-size:12px; margin-top:16px; }
    .placeholder-block { border:1px dashed var(--line); border-radius:10px; padding:12px;
                         color:var(--mut); font-size:13px; text-align:center; }

    .toast { position:fixed; left:50%; bottom:calc(88px + var(--safe-b));
             transform:translateX(-50%); background:var(--panel); border:1px solid var(--line);
             color:var(--fg); padding:9px 16px; border-radius:10px; font-size:13px; opacity:0;
             transition:opacity .2s; pointer-events:none; z-index:99; max-width:88vw;
             text-align:center; }
    .toast.show { opacity:1; }

    /* 确认弹层（移动端友好） */
    .modal-scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60;
                   display:flex; align-items:center; justify-content:center; padding:20px; }
    .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px;
             padding:16px; width:100%; max-width:380px; }
    .modal h4 { margin:0 0 8px; font-size:15px; }
    .modal p { margin:0 0 14px; font-size:13px; color:var(--mut); line-height:1.7; }
    .modal .modal-actions { display:flex; gap:8px; justify-content:flex-end; }
  </style>
</head>
<body>
  <div class="app">
    <!-- ============ 侧栏：会话列表 ============ -->
    <aside class="sidebar" id="sidebar" aria-label="对话列表">
      <div class="side-top">
        <button class="btn primary" id="newchat" title="新建对话">＋ 新对话</button>
      </div>
      <div class="searchbox">
        <input id="conv-search" type="search" placeholder="搜索对话…" autocomplete="off" />
      </div>
      <div class="conv-list" id="conv-list"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ============ 主区 ============ -->
    <div class="main">
      <header>
        <button class="icon-btn menu-btn" id="menu-btn" title="打开对话列表" aria-label="打开对话列表">☰</button>
        <span class="title">🚄 RailFanAI</span>
        <!-- 版本号由 pages.loadAppVersion() 运行时填入（唯一来源是仓库根的 VERSION）。
             这里只放一个中性兜底，不要写死版本 —— 写死过 "v0.5 · M11"，
             与 Android 包的版本号并存，正是"我到底装的哪一版"这类疑惑的来源。 -->
        <span class="badge" id="ver-badge">Community</span>
        <span class="conv-title" id="conv-title"></span>
        <span class="spacer"></span>
        <!-- 图标必须在 .txt 之外：≤480px 时 .txt 被隐藏，图标留在按钮上（窄屏唯一可见的入口） -->
        <button class="llm-btn" id="llm-btn" title="设置：模型供应商 / 关于">⚙️<span class="txt"> 设置</span></button>
      </header>

      <!-- 对话视图 -->
      <section class="view active" id="view-chat">
        <!-- 未配置模型时的引导条（由 main.js 按 /api/providers 的结果决定是否显示） -->
        <div class="notice hidden" id="llm-notice">
          <span id="llm-notice-text"></span>
          <span class="spacer"></span>
          <button class="btn primary" id="llm-notice-go">去配置</button>
          <button class="notice-close" id="llm-notice-close" title="关闭提示" aria-label="关闭提示">✕</button>
        </div>
        <div id="chat">
          <div class="empty">
            输入一句铁路相关问题，我会查 12306 / rail.re 实时数据后作答。<br />
            <span class="ex" data-q="G1今天由哪组动车组担当？">· G1今天由哪组动车组担当？</span>
            <span class="ex" data-q="明天北京到上海的高铁余票">· 明天北京到上海的高铁余票</span>
            <span class="ex" data-q="京沪线经过哪些站？">· 京沪线经过哪些站？</span>
            <span class="ex" data-q="我在吉林市船营区，要拍 CR400AF，今天下午">· 我在吉林市船营区，要拍 CR400AF，今天下午</span>
            <span style="display:block;margin-top:14px;font-size:12px;opacity:.7">
              多轮追问（如「那明天呢」）· 生成中可随时停止 · 消息可编辑重发
            </span>
          </div>
        </div>
        <div id="usagebar">
          <span id="ctxinfo"></span>
          <span>累计 Token：<b id="total-tokens">0</b></span>
        </div>
        <footer>
          <textarea id="input" rows="1" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="send" title="发送">发送</button>
        </footer>
      </section>

      <!-- 内容视图（个人中心 / 协议 / 关于）由 JS 填充 -->
      <section class="view" id="view-page">
        <div class="page" id="page-body"></div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 错误横幅：在任何脚本之前注册捕获，确保"模块加载失败/运行期抛错"能被看见。
       关闭按钮是**兄弟节点**（不是 pre 的子节点）：pre 里放 button 会让 textContent
       混进一个 ✕，而 Android 侧探针读的正是 pre 的 textContent。 -->
  <pre id="boot-error"></pre>
  <button type="button" id="boot-error-close" title="关闭错误提示" aria-label="关闭错误提示">✕</button>
  <script>
    (function () {
      var el = document.getElementById("boot-error");
      var closeBtn = document.getElementById("boot-error-close");
      // 自动隐藏时长：用户要求"约 3s"，取 4s —— 太短来不及读完一行文件名/行号
      var HIDE_MS = 4000;
      var MAX_ITEMS = 5;         // 横幅里最多并列几条不同错误
      var items = [];            // [{msg, n}] 按最近出现排序（n = 同一错误出现次数）
      var timer = null;

      function hide() {
        clearTimeout(timer);
        timer = null;
        if (el) el.style.display = "none";
        if (closeBtn) closeBtn.style.display = "none";
      }

      function render() {
        if (!el) return;
        var parts = [];
        for (var i = 0; i < items.length; i++) {
          parts.push(items[i].msg + (items[i].n > 1 ? "（已重复 " + items[i].n + " 次）" : ""));
        }
        el.textContent = parts.join("\n\n") + "\n（请把以上内容反馈给开发者）";
      }

      /**
       * 记录并显示一条错误。
       *
       * 三个刻意的设计：
       *   1) **同一错误不重复堆叠** —— 之前用 textContent += ，一个每帧都抛的错
       *      会把横幅刷到几屏长，真正有用的第一条反倒被顶走；
       *   2) **console.error 永远留一份** —— 横幅会自己消失，控制台/CDP 是唯一
       *      能在事后翻查的地方，不能因为"界面上藏了"就丢掉排查信息；
       *   3) 自动隐藏只是隐藏：**再来新错误立刻重新弹出**，不是"展示过一次就不再打扰"。
       */
      function show(msg) {
        var text = String(msg);
        console.error("[RailFanAI] " + text);
        if (!el) return;
        // 去重的 key 只取**第一行**（"脚本错误：Uncaught Error: xxx"），不含位置行：
        // 同一个异常从不同调用点抛出时行号不同，按整段比对会看到"同一句话堆两遍"
        // （真机实测过）。位置行仍随最新一次出现更新，完整历史在 console 里。
        var key = text.split("\n")[0];
        var hit = null;
        for (var i = 0; i < items.length; i++) {
          if (items[i].key === key) { hit = items[i]; break; }
        }
        if (hit) {
          hit.n++;
          hit.msg = text;          // 位置取最新一次：老位置通常已经被改掉了
          items.splice(items.indexOf(hit), 1);
          items.unshift(hit);      // 挪到最前：重复发生说明问题还在
        } else {
          items.unshift({ key: key, msg: text, n: 1 });
          if (items.length > MAX_ITEMS) items.length = MAX_ITEMS;
        }
        render();
        el.style.display = "block";
        if (closeBtn) closeBtn.style.display = "block";
        // 每次显示都重新计时：连续报错时不该在半途被上一次的定时器收走
        clearTimeout(timer);
        timer = setTimeout(hide, HIDE_MS);
      }

      // 初始化就把 inline style 钉成 none：Android 探针用 inline style 判断显隐，
      // 只靠 CSS 的话探针会把"隐藏中"误报成"横幅有内容"。
      hide();
      if (closeBtn) closeBtn.addEventListener("click", hide);

      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK" || t.tagName === "IMG")) {
          show("资源加载失败：" + (t.src || t.href));
        } else {
          show("脚本错误：" + (e.message || e)
            + (e.filename ? "\n  " + e.filename + ":" + e.lineno : ""));
        }
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        show("未处理的 Promise 拒绝：" + ((r && r.message) ? r.message : r));
      });
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
