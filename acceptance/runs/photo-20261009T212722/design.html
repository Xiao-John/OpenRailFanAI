<!doctype html><html style="color-scheme:light"><head><meta charset="utf-8"></head><body style="margin:0;background:#F8FAFD"><div class="viz-dotted-background" id="photo-spot-preview">
<style>
#photo-spot-preview{padding:52px 12px 24px}#photo-spot-preview .ps-stage{--ps-ink:light-dark(#0B1738,#E6ECF8);--ps-muted:light-dark(#526783,#A8B7D1);--ps-line:light-dark(#C5D1E2,#35435A);--ps-panel:light-dark(#F2F6FB,#202B3C);--ps-surface:light-dark(#FFFFFF,#172131);--ps-selected:light-dark(#EAF2FF,#203B69);--ps-blue:#2563EB;position:relative;max-width:360px;min-height:370px;margin:auto;color:var(--ps-ink);font:16px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}#photo-spot-preview *{box-sizing:border-box}#photo-spot-preview [hidden]{display:none!important}#photo-spot-preview button{font:inherit;color:inherit;border:0;min-height:44px;display:flex;align-items:center;gap:8px;background:transparent;text-align:left}#photo-spot-preview svg{width:20px;height:20px;flex-shrink:0}#photo-spot-preview .ps-card{width:310px;max-width:100%;margin-left:auto;padding:14px;border:1px solid var(--ps-line);border-radius:16px;background:var(--ps-surface)}#photo-spot-preview .ps-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}#photo-spot-preview h3{font-size:20px;line-height:1.35;margin:0;font-weight:700}#photo-spot-preview .ps-tag{font-size:12px;padding:4px 8px;background:var(--ps-selected);border-radius:6px;color:var(--ps-muted);white-space:nowrap}#photo-spot-preview .ps-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--ps-panel);padding:12px;border-radius:10px;margin-bottom:12px}#photo-spot-preview .ps-label{font-size:12px;color:var(--ps-muted);margin-bottom:5px}#photo-spot-preview .ps-value{display:flex;align-items:center;gap:7px;font-weight:600}#photo-spot-preview .ps-value svg{color:var(--ps-blue);width:18px;height:18px}#photo-spot-preview .ps-pending-row{display:flex;justify-content:flex-end;padding-bottom:8px}#photo-spot-preview .ps-pending{padding:0 12px;border-radius:9px;background:light-dark(#FFF1CA,#48371C);color:light-dark(#805809,#F1C979);font-size:14px}#photo-spot-preview .ps-source-button{width:100%;padding:0 10px;background:var(--ps-panel);border-radius:9px;color:var(--ps-muted);font-size:14px}#photo-spot-preview .ps-source-button .ps-arrow{margin-left:auto;width:16px}#photo-spot-preview .ps-source-detail{padding:12px 4px 0;font-size:14px;color:var(--ps-muted)}#photo-spot-preview .ps-source-detail p{margin:0 0 8px}#photo-spot-preview .ps-quiet{font-size:14px;color:var(--ps-muted);padding:10px 12px;border-radius:10px;background:var(--ps-panel);margin-bottom:12px}#photo-spot-preview .ps-modal{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:10px 0;background:light-dark(#F8FAFDEB,#101827EB);border-radius:16px;z-index:2}#photo-spot-preview .ps-dialog{width:100%;padding:18px;background:var(--ps-surface);border:1px solid var(--ps-line);border-radius:16px;box-shadow:0 8px 24px light-dark(#0B173820,#00000040)}#photo-spot-preview .ps-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px}#photo-spot-preview .ps-close{width:44px;justify-content:center}#photo-spot-preview .ps-scope{margin-top:12px;padding:8px 12px;border-radius:8px;background:var(--ps-panel);font-size:14px;color:var(--ps-muted)}#photo-spot-preview .ps-note{margin:14px 0;font-size:16px}#photo-spot-preview .ps-evidence{width:100%;justify-content:space-between;color:var(--ps-blue);font-size:14px;border-top:1px solid var(--ps-line);padding-top:8px}#photo-spot-preview .ps-evidence-body{font-size:14px;color:var(--ps-muted);padding:8px 0}#photo-spot-preview .ps-footer{margin-top:14px;padding:10px 0 0;border-top:1px solid var(--ps-line);font-size:14px;color:var(--ps-muted)}
</style>
<div class="ps-stage" aria-label="机位卡片状态设计">
<article class="ps-card" aria-label="笋岗桥机位线索">
<div class="ps-head"><h3>笋岗桥</h3><span class="ps-tag">机位线索</span></div>
<div class="ps-facts"><div><div class="ps-label">城市</div><div class="ps-value"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="#075BFF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="14" cy="14" r="10"/>
  <path d="m21.25 21.25 7 7"/>
</svg>
深圳</div></div><div><div class="ps-label">机位类型</div><div class="ps-value"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="#075BFF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 7.5h4l2.2-3h7.6l2.2 3h4a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-15a3 3 0 0 1 3-3Z"/>
  <circle cx="16" cy="18" r="5.25"/>
</svg>
桥</div></div></div>
<div class="ps-quiet" hidden></div>
<div class="ps-pending-row"><button class="ps-pending cursor-interaction" type="button" aria-haspopup="dialog"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
待确认</button></div>
<button class="ps-source-button cursor-interaction" type="button" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5 14 9.5M8 16l-1 1a4 4 0 0 1-5.7-5.7l4-4A4 4 0 0 1 11 7M16 8l1-1a4 4 0 0 1 5.7 5.7l-4 4A4 4 0 0 1 13 17"/></svg>
来源与查询详情<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
</button>
<div class="ps-source-detail" hidden><p>信息来源：原攻略</p><p class="ps-source-status">已复核 · 部分字段待确认</p><p>机位名称保留原文称呼。</p></div>
</article>
<div class="ps-modal" hidden><section class="ps-dialog" role="dialog" aria-modal="true" aria-label="待确认说明"><div class="ps-dialog-head"><h3>待确认说明</h3><button class="ps-close cursor-interaction" type="button" aria-label="关闭说明"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="ps-scope">本机位 · 铁路关系</div><p class="ps-note">原文中的铁路名称尚未完成实体绑定，暂不作为已确认的铁路信息。</p><button class="ps-evidence cursor-interaction" type="button" aria-expanded="false">查看原文依据<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
</button><div class="ps-evidence-body" hidden>暂无可展示的原文依据。</div><div class="ps-footer">深圳、桥等已确认信息保留显示。</div></section></div>
</div>
<script>
(()=>{const root=document.getElementById('photo-spot-preview');const stage=root.querySelector('.ps-stage');const modal=root.querySelector('.ps-modal');const pending=root.querySelector('.ps-pending');const source=root.querySelector('.ps-source-button');const detail=root.querySelector('.ps-source-detail');const evidence=root.querySelector('.ps-evidence');const evidenceBody=root.querySelector('.ps-evidence-body');let priorFocus=null;const state={sourceState:'reviewed'};
function render(){const reviewed=state.sourceState==='reviewed';root.querySelector('.ps-facts').hidden=!reviewed;root.querySelector('.ps-pending-row').hidden=!reviewed;const quiet=root.querySelector('.ps-quiet');quiet.hidden=reviewed;quiet.textContent=state.sourceState==='stale'?'原文已变化，旧标注暂不作为已确认信息。':state.sourceState==='unreviewed'?'尚未复核，保留原攻略阅读。':'旧词典未提供标注，继续显示原攻略内容。';root.querySelector('.ps-source-status').textContent=reviewed?'已复核 · 部分字段待确认':state.sourceState==='stale'?'原文已变化':state.sourceState==='unreviewed'?'尚未复核':'未提供标注';if(!reviewed)modal.hidden=true;}
function close(){modal.hidden=true;if(priorFocus)priorFocus.focus();}
pending.addEventListener('click',()=>{priorFocus=pending;modal.hidden=false;root.querySelector('.ps-close').focus();});root.querySelector('.ps-close').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close();});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close();if(e.key==='Tab'&&!modal.hidden){const controls=[root.querySelector('.ps-close'),evidence];if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls[1].focus();}else if(!e.shiftKey&&document.activeElement===controls[1]){e.preventDefault();controls[0].focus();}}});source.addEventListener('click',()=>{detail.hidden=!detail.hidden;source.setAttribute('aria-expanded',String(!detail.hidden));});evidence.addEventListener('click',()=>{evidenceBody.hidden=!evidenceBody.hidden;evidence.setAttribute('aria-expanded',String(!evidenceBody.hidden));});render();if(globalThis.Tweak){const tweak=new Tweak({container:stage,onChange:render});tweak.addSelect(state,'sourceState',{label:'来源状态',options:[{label:'已复核，含待确认字段',value:'reviewed'},{label:'尚未复核',value:'unreviewed'},{label:'原文变化',value:'stale'},{label:'旧词典兼容',value:'not_annotated'}]});}})();
</script>
</div>
</body></html>
